    if (r.rec_no) html += '<div class="row"><div class="label">公证单号</div><div class="value">' + r.rec_no + '</div></div>';
    html += '<div class="row"><div class="label">结算总额</div><div class="value">' + r.amount + ' USDT</div></div>';
    if (r.from_addr) html += '<div class="row"><div class="label">出资方地址</div><div class="value hash">' + r.from_addr + '</div></div>';
    if (r.to_addr) html += '<div class="row"><div class="label">接收方地址</div><div class="value hash">' + r.to_addr + '</div></div>';
    if (r.tx_hash) html += '<div class="row"><div class="label">交易哈希</div><div class="value hash">' + r.tx_hash + '</div></div>';
  });
  contentEl.innerHTML = html;
  resultEl.classList.add('show');
}

document.getElementById('phone').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') query();
});
document.getElementById('name').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') query();
});
</script>
