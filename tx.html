function getParam(name){
  var m=location.search.match(new RegExp('[?&]'+name+'=([^&]+)'));
  return m?decodeURIComponent(m[1]):'';
}

function maskAddr(addr){
  if(!addr||addr.length<10) return addr||'—';
  return addr.slice(0,4)+'****'+addr.slice(-4);
}

function formatHash(h){
  if(!h) return '—';
  var s='';
  for(var i=0;i<h.length;i+=4){s+=h.slice(i,i+4)+' '}
  return s.trim();
}

function formatTime(ts){
  if(!ts) return '—';
  var d=new Date(ts);
  var p=function(n){return n<10?'0'+n:n};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

function copyText(t,e){
  if(e)e.stopPropagation();
  var inp=document.createElement('textarea');inp.value=t;document.body.appendChild(inp);inp.select();
  try{document.execCommand('copy');}catch(err){}
  document.body.removeChild(inp);
}

var copySvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';

function render(tx){
  var html='';
  // 头部
  html+='<div class="header">';
  html+='<div class="title">转账凭证</div>';
  html+='<div class="subtitle">'+tx.serial+' · '+tx.name+'</div>';
  html+='</div>';

  // 交易时间
  html+='<div class="info-block">';
  html+='<div class="label">交易时间</div>';
  html+='<div class="value">'+formatTime(tx.timestamp)+'</div>';
  html+='</div>';

  html+='<div class="dashed-divider"></div>';

  // 交易金额
  html+='<div class="info-block">';
  html+='<div class="label">交易金额</div>';
  html+='<div class="value amount-value">'+tx.amount_str+'<span class="currency">USDT-TRC20</span></div>';
  html+='</div>';

  // 双栏费用
  html+='<div class="info-block dual-column">';
  html+='<div class="column"><div class="label">带宽花费</div><div class="value">'+(tx.net_fee||0.0091)+' TRX</div></div>';
  html+='<div class="column"><div class="label">能量花费</div><div class="value">'+(tx.energy_fee||0.731)+' TRX</div></div>';
  html+='</div>';

  // 交易状态
  html+='<div class="info-block">';
  html+='<div class="label">交易状态</div>';
  html+='<div class="value status-confirmed">已确认</div>';
  html+='</div>';

  // 交易ID卡片
  html+='<div class="info-block">';
  html+='<div class="label">交易ID</div>';
  html+='<div class="id-card">';
  html+='<button class="copy-btn" onclick="copyText(\''+tx.tx_hash+'\',event)">复制</button>';
  html+='<div class="card-content">'+formatHash(tx.tx_hash)+'</div>';
  html+='<div class="card-corner"></div>';
  html+='</div>';
  html+='</div>';

  // 交易目地地址（脱敏）
  html+='<div class="info-block">';
  html+='<div class="label">交易目地地址</div>';
  html+='<div class="address-line">';
  html+='<span class="address-text">'+maskAddr(tx.to_addr)+'</span>';
  html+='<span class="address-tag">（他人地址）</span>';
  html+='<span class="copy-icon" onclick="copyText(\''+tx.to_addr+'\',event)">'+copySvg+'</span>';
  html+='</div>';
  html+='</div>';

  // 交易原地址（脱敏）
  var fromAddr=tx.from_addr||'';
  html+='<div class="info-block">';
  html+='<div class="label">交易原地址</div>';
  html+='<div class="address-line">';
  if(fromAddr){
    html+='<span class="address-text self">'+maskAddr(fromAddr)+'</span>';
    html+='<span class="address-tag">（信托结算专户）</span>';
    html+='<span class="copy-icon" onclick="copyText(\''+fromAddr+'\',event)">'+copySvg+'</span>';
  }else{
    html+='<span class="address-text self" style="color:#999">信托结算专户</span>';
    html+='<span class="address-tag">（系统归集）</span>';
  }
  html+='</div>';
  html+='</div>';

  // 底部
  html+='<div class="footer">';
  html+='<a class="link" href="#" onclick="history.back();return false">← 返回回执单</a>';
  html+='<div class="note">本凭证由 PTAHDAO 司法区块链存证专网生成</div>';
  html+='</div>';

  return html;
}

(function(){
  var seq=getParam('seq');
  var hash=getParam('hash');
  var tx=null;
  if(seq){
    tx=TX_DATA.find(function(t){return t.seq===seq});
  }else if(hash){
    tx=TX_DATA.find(function(t){return t.tx_hash===hash});
  }
  var el=document.getElementById('receipt');
  if(tx){
    el.innerHTML=render(tx);
    document.title='转账凭证 · '+tx.name+' · '+tx.serial;
  }else{
    el.innerHTML='<div class="loading">未找到对应的转账记录。</div>';
  }
})();
