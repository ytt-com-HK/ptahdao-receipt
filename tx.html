<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f6fa;color:#1a1a1a;font-size:14px}
/* 顶部导航 */
.navbar{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 24px;height:56px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.navbar .logo{font-size:20px;font-weight:700;color:#e8413d;letter-spacing:-0.5px}
.navbar .logo span{color:#1a1a1a}
.navbar .search{flex:1;max-width:480px;margin:0 32px}
.navbar .search input{width:100%;height:36px;border:1px solid #e0e0e0;border-radius:6px;padding:0 12px;font-size:13px}
.navbar .nav-links{display:flex;gap:24px;font-size:13px;color:#555}
.navbar .nav-links a{color:#555;text-decoration:none}
.navbar .nav-links a:hover{color:#e8413d}
/* 容器 */
.container{max-width:1200px;margin:24px auto;padding:0 24px}
/* 面包屑 */
.breadcrumb{font-size:13px;color:#888;margin-bottom:16px}
.breadcrumb a{color:#1890ff;text-decoration:none}
/* 交易标题 */
.tx-header{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px 24px;margin-bottom:16px}
.tx-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tx-title h1{font-size:18px;font-weight:600;color:#1a1a1a;word-break:break-all;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:14px}
.badge-success{background:#52c41a;color:#fff;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600}
.badge-confirmed{background:#1890ff;color:#fff;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600}
/* 概览网格 */
.overview{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px 24px;margin-bottom:16px}
.overview h3{font-size:14px;font-weight:600;margin-bottom:16px;color:#1a1a1a;border-bottom:1px solid #f0f0f0;padding-bottom:12px}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px 32px}
.ov-item{display:flex;flex-direction:column;gap:4px}
.ov-label{font-size:12px;color:#888}
.ov-value{font-size:13px;color:#1a1a1a;font-weight:500;word-break:break-all}
.ov-value.mono{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px}
.ov-value.green{color:#52c41a}
.ov-value.blue{color:#1890ff}
/* 详情表格 */
.detail-table{background:#fff;border:1px solid #e8e8e8;border-radius:8px;overflow:hidden;margin-bottom:16px}
.detail-table h3{font-size:14px;font-weight:600;padding:16px 24px;border-bottom:1px solid #f0f0f0}
.detail-row{display:flex;padding:12px 24px;border-bottom:1px solid #f5f5f5}
.detail-row:last-child{border-bottom:none}
.detail-row .label{width:180px;color:#888;font-size:13px;flex-shrink:0}
.detail-row .value{flex:1;color:#1a1a1a;font-size:13px;word-break:break-all}
.detail-row .value.mono{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px}
.detail-row .value a{color:#1890ff;text-decoration:none}
.detail-row .value a:hover{text-decoration:underline}
.copy-btn{display:inline-block;margin-left:8px;color:#1890ff;cursor:pointer;font-size:12px;border:none;background:none}
/* 转账信息卡 */
.transfer-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px 24px;margin-bottom:16px}
.transfer-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:#1a1a1a;border-bottom:1px solid #f0f0f0;padding-bottom:12px}
.transfer-flow{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 0;flex-wrap:wrap}
.addr-box{background:#fafafa;border:1px solid #e8e8e8;border-radius:8px;padding:16px 20px;text-align:center;min-width:240px}
.addr-box .role{font-size:12px;color:#888;margin-bottom:8px}
.addr-box .addr{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;color:#1a1a1a;word-break:break-all;margin-bottom:8px}
.addr-box .tag{display:inline-block;background:#e6f7ff;color:#1890ff;padding:2px 8px;border-radius:4px;font-size:11px}
.arrow{font-size:24px;color:#1890ff;font-weight:bold}
.amount-box{text-align:center}
.amount-box .amount{font-size:24px;font-weight:700;color:#52c41a}
.amount-box .token{font-size:13px;color:#888;margin-top:4px}
/* 资源消耗 */
.resources{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px 24px;margin-bottom:16px}
.resources h3{font-size:14px;font-weight:600;margin-bottom:16px;color:#1a1a1a;border-bottom:1px solid #f0f0f0;padding-bottom:12px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px 32px}
.res-item{display:flex;flex-direction:column;gap:4px}
.res-item .label{font-size:12px;color:#888}
.res-item .value{font-size:14px;color:#1a1a1a;font-weight:600}
/* 返回链接 */
.back-link{display:inline-block;margin-bottom:16px;color:#1890ff;text-decoration:none;font-size:13px}
.back-link:hover{text-decoration:underline}
@media(max-width:768px){
  .navbar .nav-links{display:none}
  .navbar .search{display:none}
  .detail-row{flex-direction:column;gap:4px}
  .detail-row .label{width:auto}
  .transfer-flow{flex-direction:column}
}
</style>

}
